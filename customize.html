<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>デザイン着せ替え - PARMEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg-dark: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-bg-navy: linear-gradient(135deg, #1b263b 0%, #0d1b2a 100%);
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold);
    }

    .back-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.8rem;
    }

    .section {
      background: #16181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: bold;
    }

    .option-group {
      display: flex;
      gap: 8px;
    }

    .opt-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .opt-btn.active {
      border-color: var(--gold);
      background: rgba(229, 192, 123, 0.15);
      color: var(--gold);
      font-weight: bold;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--gold), #d4a359);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(229,192,123,0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>CARD CUSTOMIZE</h1>
      <a href="index.html" class="back-btn">⬅ キャンセル</a>
    </div>

    <!-- 称号選択 -->
    <div class="section">
      <div class="section-title">バッジ称号</div>
      <div class="option-group">
        <button class="opt-btn active" id="title-1" onclick="selectTitle('FOUNDER', 'title-1')">FOUNDER</button>
        <button class="opt-btn" id="title-2" onclick="selectTitle('初期ユーザー', 'title-2')">初期ユーザー</button>
        <button class="opt-btn" id="title-3" onclick="selectTitle('VIP PAL', 'title-3')">VIP PAL</button>
      </div>
    </div>

    <!-- アイコン枠選択 -->
    <div class="section">
      <div class="section-title">アイコンフレーム</div>
      <div class="option-group">
        <button class="opt-btn active" id="frame-1" onclick="selectFrame('normal', 'frame-1')">ノーマル</button>
        <button class="opt-btn" id="frame-2" onclick="selectFrame('gold', 'frame-2')">ゴールド</button>
      </div>
    </div>

    <!-- 名刺テーマカラー選択 -->
    <div class="section">
      <div class="section-title">名刺背景カラー</div>
      <div class="option-group">
        <button class="opt-btn active" id="theme-1" onclick="selectTheme('dark', 'theme-1')">ダークブラック</button>
        <button class="opt-btn" id="theme-2" onclick="selectTheme('navy', 'theme-2')">エレガントネイビー</button>
      </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">設定を保存してホームに戻る</button>
  </div>

  <script>
    // 現在の選択状態を保持
    let currentTitle = 'FOUNDER';
    let currentFrame = 'normal';
    let currentTheme = 'dark';

    // 画面読み込み時に保存済みの設定を反映
    window.addEventListener('DOMContentLoaded', () => {
      const savedTitle = localStorage.getItem('pal_title') || 'FOUNDER';
      const savedFrame = localStorage.getItem('pal_frame') || 'normal';
      const savedTheme = localStorage.getItem('pal_theme') || 'dark';

      // ボタンの見た目を保存済みの状態に合わせる
      if (savedTitle === 'FOUNDER') selectTitle('FOUNDER', 'title-1');
      if (savedTitle === '初期ユーザー') selectTitle('初期ユーザー', 'title-2');
      if (savedTitle === 'VIP PAL') selectTitle('VIP PAL', 'title-3');

      if (savedFrame === 'normal') selectFrame('normal', 'frame-1');
      if (savedFrame === 'gold') selectFrame('gold', 'frame-2');

      if (savedTheme === 'dark') selectTheme('dark', 'theme-1');
      if (savedTheme === 'navy') selectTheme('navy', 'theme-2');
    });

    function selectTitle(val, btnId) {
      currentTitle = val;
      setActive(['title-1', 'title-2', 'title-3'], btnId);
    }

    function selectFrame(val, btnId) {
      currentFrame = val;
      setActive(['frame-1', 'frame-2'], btnId);
    }

    function selectTheme(val, btnId) {
      currentTheme = val;
      setActive(['theme-1', 'theme-2'], btnId);
    }

    function setActive(groupIds, activeId) {
      groupIds.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active');
      });
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }

    // localStorageに保存して index.html へ戻る
    function saveSettings() {
      localStorage.setItem('pal_title', currentTitle);
      localStorage.setItem('pal_frame', currentFrame);
      localStorage.setItem('pal_theme', currentTheme);

      alert('デザインを保存しました！');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
