<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PALCARD カスタマイズ - PARMEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg-dark: #16181b;
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --gold-dark: #8c6a2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(229, 192, 123, 0.2);
      padding-bottom: 12px;
    }

    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold);
      letter-spacing: 0.1em;
    }

    .back-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--gold); }

    /* 設定カードボックス */
    .custom-card {
      background: var(--card-bg-dark);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 0.9rem;
      color: var(--gold);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--gold);
    }

    /* トグルスイッチ */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .toggle-row span {
      font-size: 0.85rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--gold); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* カラープリセットボタン */
    .color-picker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .color-btn {
      height: 36px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .color-btn.active {
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    /* 保存ボタン */
    .save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), #d4a359);
      color: #0b0d0e;
      font-weight: bold;
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(229,192,123,0.3);
      transition: opacity 0.2s;
    }

    .save-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>PALCARD CUSTOMIZE</h1>
      <a href="index.html" class="back-btn">戻る</a>
    </div>

    <div class="custom-card">
      <div class="card-title">🎨 名刺デザインの設定</div>

      <!-- 称号編集 -->
      <div class="form-group">
        <label>バッジ称号テキスト</label>
        <input type="text" id="cust-title" class="input-field" placeholder="例: FOUNDER, 初期ユーザー">
      </div>

      <!-- カラーテーマ選択 -->
      <div class="form-group">
        <label>名刺の背景テーマカラー</label>
        <div class="color-picker-grid">
          <button class="color-btn" id="c-dark" style="background: linear-gradient(135deg, #24292e, #16181b);" onclick="selectColor('dark')"></button>
          <button class="color-btn" id="c-navy" style="background: linear-gradient(135deg, #1b263b, #0d1b2a);" onclick="selectColor('navy')"></button>
          <button class="color-btn" id="c-wine" style="background: linear-gradient(135deg, #3d0c11, #1f0508);" onclick="selectColor('wine')"></button>
          <button class="color-btn" id="c-emerald" style="background: linear-gradient(135deg, #0d3b2e, #051b14);" onclick="selectColor('emerald')"></button>
        </div>
      </div>

      <!-- ゴールドフレーム切替 -->
      <div class="toggle-row">
        <span>アイコンのゴールド枠</span>
        <label class="switch">
          <input type="checkbox" id="cust-gold-frame">
          <span class="slider"></span>
        </label>
      </div>

      <!-- 保存ボタン -->
      <button class="save-btn" onclick="saveCustomization()">設定を保存してホームに反映</button>
    </div>
  </div>

  <script>
    let selectedTheme = 'dark';

    // 画面が開いたときに、すでに保存されている設定を読み込んで反映
    window.addEventListener('DOMContentLoaded', () => {
      const savedTitle = localStorage.getItem('pal_title') || 'FOUNDER';
      const savedTheme = localStorage.getItem('pal_theme') || 'dark';
      const savedFrame = localStorage.getItem('pal_frame') === 'true';

      document.getElementById('cust-title').value = savedTitle;
      document.getElementById('cust-gold-frame').checked = savedFrame;
      selectColor(savedTheme);
    });

    // カラーボタン選択の視覚処理
    function selectColor(theme) {
      selectedTheme = theme;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      
      const activeBtn = document.getElementById(`c-${theme}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // localStorage に設定を保存して index.html へ送る
    function saveCustomization() {
      const titleVal = document.getElementById('cust-title').value || 'PAL';
      const isGoldFrame = document.getElementById('cust-gold-frame').checked;

      localStorage.setItem('pal_title', titleVal);
      localStorage.setItem('pal_theme', selectedTheme);
      localStorage.setItem('pal_frame', isGoldFrame ? 'true' : 'false');

      alert('デザイン設定を保存しました！');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
