<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PARMEL - ALBUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- html2canvas ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0d0e;
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    .app-viewport {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* 下部パディングを適切な隙間（80px）に調整 */
      padding: 12px 12px 90px 12px;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-align: center;
      margin-top: 4px;
    }

    /* 9マス Grid (表示専用) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .grid-item {
      background: #15181b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1 / 1.25;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* 9マス フレームスタイル バリエーション */
    .grid-container.gridframe-standard .grid-item,
    .history-grid.gridframe-standard .history-grid-item {
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .grid-container.gridframe-gold .grid-item,
    .history-grid.gridframe-gold .history-grid-item {
      border: 1.5px solid var(--gold);
    }
    .grid-container.gridframe-neon .grid-item,
    .history-grid.gridframe-neon .history-grid-item {
      border: 1.5px solid #00f2fe;
    }
    .grid-container.gridframe-dark .grid-item,
    .history-grid.gridframe-dark .history-grid-item {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0d0f11;
    }

    .grid-label {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 4px 2px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .grid-label-display {
      color: var(--gold);
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .grid-image-box {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .grid-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid-item.palmel-item .grid-image-box {
      position: relative;
    }

    .grid-item.palmel-item .grid-image-box img.has-image {
      filter: brightness(0.45);
    }

    .palmel-overlay-logo {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 10px rgba(229, 192, 123, 0.6), 0 0 20px rgba(229, 192, 123, 0.3);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      padding: 0 2px;
    }

    /* 保存ボタン */
    .save-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e5c07b, #c8a25c);
      color: #0b0d0e;
      border: none;
      border-radius: 8px;
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 192, 123, 0.2);
      transition: all 0.2s ease;
    }

    .save-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .save-btn.saved {
      background: #2a2f35 !important;
      color: var(--text-sub) !important;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    /* 履歴セクション */
    .history-section {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .history-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-sub);
      text-align: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .history-card {
      background: #15181b;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .history-header {
      display: grid;
      grid-template-columns: 75px 1fr 75px;
      align-items: center;
      padding: 2px 0;
    }

    .history-delete-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.6rem;
      cursor: pointer;
      padding: 2px 4px;
      text-align: left;
    }
    .history-delete-btn:hover { color: #ff6b6b; }

    .history-date {
      text-align: center;
      font-size: 0.78rem;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .history-phone-save-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.6rem;
      cursor: pointer;
      padding: 2px 4px;
      text-align: right;
      justify-self: end;
    }
    .history-phone-save-btn:hover { color: var(--text-main); }

    /* 保存された履歴内のミニ9マスグリッド */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      width: 100%;
      background: #15181b;
    }

    .history-grid-item {
      background: #0b0d0e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1 / 1.25;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .history-grid-label {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.48rem;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 2px;
      background: rgba(0, 0, 0, 0.5);
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-grid-image-box {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-grid-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-palmel-logo {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 8px rgba(229, 192, 123, 0.6);
      pointer-events: none;
    }
    .history-grid-item.palmel-item img.has-image {
      filter: brightness(0.45);
    }

    /* ボトムナビゲーション (画面下に固定) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      height: 60px;
      background: rgba(15, 17, 20, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99999;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.62rem;
      cursor: pointer;
      width: 25%;
      text-decoration: none;
    }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

  <!-- スクロール可能なビューポート -->
  <div class="app-viewport">
    <h1 class="page-title">ALBUM</h1>

    <!-- 9マス Grid (表示専用) -->
    <div class="grid-container gridframe-standard">
      <div class="grid-item"><div class="grid-label">MONTHLY</div><div class="grid-image-box"><img id="view-g0"></div></div>
      <div class="grid-item"><div class="grid-label">CHARMPOINT</div><div class="grid-image-box"><img id="view-g1"></div></div>
      <div class="grid-item"><div class="grid-label"><span id="view-free-label" class="grid-label-display">FREE</span></div><div class="grid-image-box"><img id="view-g2"></div></div>
      <div class="grid-item"><div class="grid-label">FOOD</div><div class="grid-image-box"><img id="view-g3"></div></div>
      <div class="grid-item"><div class="grid-label">MAIN</div><div class="grid-image-box"><img id="view-g4"></div></div>
      <div class="grid-item"><div class="grid-label">SLEEPING</div><div class="grid-image-box"><img id="view-g5"></div></div>
      <div class="grid-item"><div class="grid-label">TOYS</div><div class="grid-image-box"><img id="view-g6"></div></div>
      <div class="grid-item"><div class="grid-label">FUNNYSHOT</div><div class="grid-image-box"><img id="view-g7"></div></div>
      <div class="grid-item palmel-item"><div class="grid-label">NOSE＋PALMEL</div><div class="grid-image-box"><img id="view-g8"><div class="palmel-overlay-logo">PALMEL</div></div></div>
    </div>

    <!-- アルバムに追加ボタン -->
    <div class="save-btn-container">
      <button id="save-album-btn" class="save-btn" type="button">アルバムに追加</button>
    </div>

    <!-- 過去に保存したアルバム一覧（PALMEL MEMORY） -->
    <div class="history-section">
      <h2 class="history-title">PALMEL MEMORY</h2>
      <div class="history-list" id="history-list-container">
        <!-- 保存された履歴がここに入ります -->
      </div>
    </div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn" id="btn-mypal">MYPAL</a>
    <a href="album.html" class="nav-btn active" id="btn-album">ALBUM</a>
    <a href="palrium.html" class="nav-btn" id="btn-exchange">PALRIUM</a>
    <a href="pals.html" class="nav-btn" id="btn-feed">PALS</a>
  </nav>

  <script>
    const STORAGE_KEY = 'parmel_grid_data';
    const DB_NAME = 'ParmelAlbumDB';
    const STORE_NAME = 'albums';
    const gridLabelsStatic = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'NOSE＋PALMEL'];

    let currentAlbumData = {
      images: Array(9).fill(''),
      freeLabel: 'FREE'
    };

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    }

    function loadParentData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);
          if (data.images) currentAlbumData.images = data.images;
          if (data.freeLabel) currentAlbumData.freeLabel = data.freeLabel;
        }

        const customSaved = localStorage.getItem('parmel_custom_config');
        if (customSaved) {
          const config = JSON.parse(customSaved);
          const gridContainer = document.querySelector('.grid-container');
          if (gridContainer && config.gridFrame) {
            gridContainer.classList.remove('gridframe-standard', 'gridframe-gold', 'gridframe-neon', 'gridframe-dark');
            gridContainer.classList.add(config.gridFrame);
          }
        }
      } catch (e) {
        console.error('Failed to load parent data', e);
      }

      currentAlbumData.images.forEach((src, i) => {
        const img = document.getElementById(`view-g${i}`);
        if (img) {
          img.src = src || '';
          if (i === 8 && src) {
            img.classList.add('has-image');
          } else {
            img.classList.remove('has-image');
          }
        }
      });

      const freeLblEl = document.getElementById('view-free-label');
      if (freeLblEl) {
        freeLblEl.innerText = currentAlbumData.freeLabel || 'FREE';
      }
    }

    function compressImage(src) {
      return new Promise((resolve) => {
        if (!src || !src.startsWith('data:image')) {
          resolve(src);
          return;
        }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 250;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.5));
        };
        img.onerror = () => resolve(src);
        img.src = src;
      });
    }

    async function handleSaveAlbum() {
      const btn = document.getElementById('save-album-btn');
      if (!btn || btn.classList.contains('saved')) return;

      btn.innerText = '保存中...';

      let currentFrame = 'gridframe-standard';
      try {
        const customSaved = localStorage.getItem('parmel_custom_config');
        if (customSaved) {
          const config = JSON.parse(customSaved);
          if (config.gridFrame) currentFrame = config.gridFrame;
        }
      } catch (e) {
        console.error(e);
      }

      const compressedImages = await Promise.all(
        currentAlbumData.images.map(img => compressImage(img))
      );

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

      const newAlbum = {
        id: String(Date.now() + Math.random().toString(36).substr(2, 4)),
        date: dateStr,
        freeLabel: currentAlbumData.freeLabel,
        gridFrame: currentFrame,
        images: compressedImages,
        timestamp: Date.now()
      };

      try {
        const db = await openDB();
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.put(newAlbum);

        transaction.oncomplete = () => {
          renderHistory();
          btn.classList.add('saved');
          btn.innerText = '追加されました！';

          setTimeout(() => {
            btn.classList.remove('saved');
            btn.innerText = 'アルバムに追加';
          }, 1500);
        };

        transaction.onerror = () => {
          alert('データの保存に失敗しました。');
          btn.innerText = 'アルバムに追加';
        };
      } catch (e) {
        console.error(e);
        alert('データベースのエラーが発生しました。');
        btn.innerText = 'アルバムに追加';
      }
    }

    async function renderHistory() {
      const container = document.getElementById('history-list-container');
      if (!container) return;
      container.innerHTML = '';

      let history = [];
      try {
        const db = await openDB();
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        
        history = await new Promise((resolve, reject) => {
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });

        history.sort((a, b) => b.timestamp - a.timestamp);
      } catch (e) {
        console.error(e);
      }

      if (history.length === 0) {
        container.innerHTML = `<div style="text-align: center; font-size: 0.65rem; color: var(--text-sub); padding: 10px;">追加されたアルバムはありません</div>`;
        return;
      }

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.id = `history-card-${item.id}`;

        let gridHtml = '';
        item.images.forEach((imgSrc, i) => {
          const labelText = (i === 2) ? (item.freeLabel || 'FREE') : gridLabelsStatic[i];
          const isPalmel = (i === 8);
          const palmelClass = isPalmel ? ' palmel-item' : '';
          const palmelLogo = isPalmel ? `<div class="history-palmel-logo">PALMEL</div>` : '';
          const imgTag = imgSrc ? `<img src="${imgSrc}" class="has-image">` : `<img src="">`;

          gridHtml += `
            <div class="history-grid-item${palmelClass}">
              <div class="history-grid-label">${labelText}</div>
              <div class="history-grid-image-box">
                ${imgTag}
                ${palmelLogo}
              </div>
            </div>
          `;
        });

        const frameClass = item.gridFrame || 'gridframe-standard';

        card.innerHTML = `
          <div class="history-header">
            <button class="history-delete-btn" type="button" onclick="deleteHistoryItem('${item.id}')">削除</button>
            <span class="history-date">${item.date}</span>
            <button class="history-phone-save-btn" type="button" onclick="saveToPhone('${item.id}')">写真に保存</button>
          </div>
          <div class="history-grid ${frameClass}" id="history-grid-${item.id}">
            ${gridHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    window.saveToPhone = async function(id) {
      const gridEl = document.getElementById(`history-grid-${id}`);
      if (!gridEl) return;

      html2canvas(gridEl, {
        backgroundColor: '#0b0d0e',
        scale: 2,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `PARMEL_Album_${id}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        console.error('画像保存に失敗しました', err);
        alert('画像の保存に失敗しました');
      });
    };

    window.deleteHistoryItem = async function(id) {
      if (!confirm('この保存アルバムを削除しますか？')) return;
      try {
        const db = await openDB();
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.delete(id);

        transaction.oncomplete = () => {
          renderHistory();
        };
      } catch (e) {
        console.error(e);
      }
    };

    function initApp() {
      loadParentData();
      renderHistory();

      const saveBtn = document.getElementById('save-album-btn');
      if (saveBtn) {
        saveBtn.replaceWith(saveBtn.cloneNode(true));
        const newSaveBtn = document.getElementById('save-album-btn');
        newSaveBtn.addEventListener('click', handleSaveAlbum);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
