#screen2 .tap-effect {

<script>

/* =========================================================
   画面
========================================================= */

const screens = [

  document.getElementById("screen1"),
  document.getElementById("screen2"),
  document.getElementById("screen3"),
  document.getElementById("screen4"),
  document.getElementById("screen5")

];

let currentScreen = 0;


/* =========================================================
   画面切り替え
========================================================= */

function showScreen(index) {

  screens.forEach((screen, i) => {

    screen.classList.toggle(
      "active",
      i === index
    );

  });

  currentScreen = index;

}


/* =========================================================
   ① → ②
========================================================= */

screens[0].addEventListener(
  "click",
  function(event) {

    if (
      event.target.closest(".replay")
    ) {
      return;
    }

    showScreen(1);

  }
);


/* =========================================================
   ① リプレイ
========================================================= */

document
  .getElementById("replay1")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      const cards =
        document.querySelectorAll(
          "#screen1 .flying-card"
        );

      const logo =
        document.querySelector(
          "#screen1 .logo"
        );

      cards.forEach(card => {

        card.style.animation = "none";

      });

      logo.style.animation = "none";

      void document.body.offsetWidth;

      cards.forEach(card => {

        card.style.animation = "";

      });

      logo.style.animation = "";

    }
  );


/* =========================================================
   ②
   1回目タップ
   ↓
   90度回転
========================================================= */

let cardRotated = false;


function rotateCard() {

  if (cardRotated) {
    return;
  }

  cardRotated = true;

  const screen2 =
    document.getElementById("screen2");

  screen2.classList.add("rotated");

}


/* =========================================================
   ② 名刺タップ
========================================================= */

document
  .getElementById("cardTap")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      rotateCard();

    }
  );


/* =========================================================
   ② 回転後
   どこをタップしても③へ
========================================================= */

document
  .getElementById("screen2")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target.closest(".replay")
      ) {
        return;
      }

      if (!cardRotated) {
        return;
      }

      showScreen(2);

    }
  );


/* =========================================================
   ② リプレイ
========================================================= */

document
  .getElementById("replay2")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      cardRotated = false;

      const screen2 =
        document.getElementById("screen2");

      screen2.classList.remove("rotated");

      const card =
        document.querySelector(
          "#screen2 .card"
        );

      card.style.animation = "none";

      void document.body.offsetWidth;

      card.style.animation = "";

    }
  );


/* =========================================================
   ③ → ④
========================================================= */

screens[2].addEventListener(
  "click",
  function() {

    showScreen(3);

  }
);


/* =========================================================
   ④ → ⑤
========================================================= */

screens[3].addEventListener(
  "click",
  function() {

    showScreen(4);

  }
);


/* =========================================================
   ⑤ → home.html
========================================================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    function() {

      document.body.style.transition =
        "opacity .5s ease";

      document.body.style.opacity =
        "0";

      setTimeout(
        function() {

          window.location.href =
            "home.html";

        },
        500
      );

    }
  );

</script>
