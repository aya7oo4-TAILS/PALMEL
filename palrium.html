<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PARMEL - PALRIUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      --avatar-bg: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 16px;
      --radius-grid: 12px;
      --radius-switch: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 120px 12px;
      gap: 16px;
    }

    /* ヘッダー周り（左右対称にしてタイトルを真ん中に配置） */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding: 0 4px;
      position: relative;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* バランス用のダミー要素（右側のボタンと同じ幅を左側にも確保） */
    .header-spacer {
      width: 61px;
    }

    /* レイアウト切り替えボタン群 */
    .layout-switcher {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: var(--radius-switch);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: auto;
    }

    .layout-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .layout-btn.active {
      background: rgba(229, 192, 123, 0.2);
      color: var(--gold);
    }

    /* 画面切り替え */
    .view-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view-screen.active {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    /* PALCARD一覧コンテナ */
    .pals-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s ease;
    }

    .pals-list-container.layout-1 {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pals-list-container.layout-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 10px;
    }
    .layout-2 .palcard-container {
      aspect-ratio: 1.65 / 1;
    }
    .layout-2 .palcard {
      padding: 8px 10px;
    }
    .layout-2 .palcard-brand { font-size: 0.42rem; letter-spacing: 0.2em; margin-bottom: 0px; }
    .layout-2 .user-title-display { font-size: 0.48rem; margin-top: 1px; margin-bottom: 0px; min-height: 0.5rem; }
    .layout-2 .pet-name { font-size: 1.15rem; margin-bottom: 0px; }
    .layout-2 .profile-fields { display: none; }
    .layout-2 .right-avatar-container { width: 68px; margin-top: 2px; }
    .layout-2 .avatar-wrapper { width: 64px; height: 64px; padding: 2px; }
    .layout-2 .new-badge {
      width: 18px;
      height: 18px;
      font-size: 0.45rem;
      top: -6px;
      right: -6px;
    }

    /* PALCARD フリップコンテナ */
    .palcard-container {
      perspective: 1000px;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      flex-shrink: 0;
      cursor: pointer;
    }

    .palcard-flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .palcard-container.flipped .palcard-flipper {
      transform: rotateY(180deg);
    }

    /* 新着バッジ */
    .new-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      background: var(--gold);
      border: 2px solid #16181b;
      color: #16181b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      z-index: 50;
      pointer-events: none;
    }

    /* PALCARDデザイン共通 */
    .palcard {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      background-size: cover;
      background-position: center;
      border-radius: var(--radius-card);
      padding: 12px 14px 44px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: auto;
    }

    .palcard-back {
      transform: rotateY(180deg);
      justify-content: space-between;
      padding: 12px 14px 20px;
    }

    .palcard-brand { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.35em; color: var(--text-sub); font-weight: 600; text-align: center; margin-bottom: 2px; }
    .palcard-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex: 1; }
    
    .profile-info { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      min-width: 0; 
      justify-content: flex-start; 
      margin-top: 10px;
      position: relative;
    }
    
    .user-title-display {
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: 500;
      margin-top: 4px; 
      margin-bottom: 3px;
      letter-spacing: 0.05em;
      min-height: 0.9rem;
    }

    .pet-name { 
      font-family: 'Cinzel', 'Noto Sans JP', sans-serif; 
      font-size: 2.15rem; 
      line-height: 1.3; 
      padding-top: 4px;  
      margin-top: 0;   
      margin-bottom: 4px;  
      font-weight: 700; 
      color: #fff; 
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    
    .profile-fields { 
      display: flex; 
      flex-direction: column; 
      gap: 1px; 
      margin-top: auto; 
    }
    
    .field-row {
      position: relative;
      display: flex;
      align-items: center;
      padding-bottom: 2px;
      margin-bottom: 2px;
      padding-right: 8px;
    }
    .field-row::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 95%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .field-label { font-size: 0.52rem; color: var(--text-sub); width: 60px; flex-shrink: 0; }
    .field-value { color: var(--text-main); font-size: 0.6rem; font-weight: 500; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .right-avatar-container { 
      position: relative; 
      width: 168px; 
      flex-shrink: 0; 
      display: flex; 
      align-items: flex-start; 
      justify-content: center; 
      margin-top: 18px; 
    }
    .avatar-wrapper { width: 164px; height: 164px; border-radius: 50%; padding: 3px; background: var(--avatar-bg); display: block; transition: all 0.3s ease; }
    
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1d20; }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

    /* 裏面カード専用のデザインレイアウト */
    .back-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      gap: 14px;
      text-align: center;
      padding: 10px 0 20px;
    }
    .back-owner-title { font-size: 0.55rem; letter-spacing: 0.2em; color: var(--text-sub); }
    .back-owner-name { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }

    /* 個別ホーム画面の9マスグリッド */
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-top: 4px; }
    .grid-item { background: #15181b; border-radius: var(--radius-grid); display: flex; flex-direction: column; aspect-ratio: 1 / 1.25; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); transition: all 0.3s ease; }
    .grid-label { font-family: 'Cinzel', 'Noto Sans JP', serif; font-size: 0.58rem; letter-spacing: 0.1em; text-align: center; padding: 4px 2px; background: rgba(0, 0, 0, 0.4); color: var(--text-sub); display: flex; align-items: center; justify-content: center; z-index: 2; }
    .grid-image-box { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .grid-image-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .grid-item.palmel-item .grid-image-box img.has-image { filter: brightness(0.45); }
    .palmel-overlay-logo {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95); text-shadow: 0 0 10px rgba(229, 192, 123, 0.6), 0 0 20px rgba(229, 192, 123, 0.3);
      pointer-events: none; text-align: center; padding: 0 2px; z-index: 5;
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 99999;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; text-decoration: none; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>

    let currentPalsData = [];
    let currentLayout = 1;

    window.changeLayout = function(layoutNum) {
      currentLayout = layoutNum;
      const container = document.getElementById('pals-list-container');
      container.className = `pals-list-container layout-${layoutNum}`;

      for (let i = 1; i <= 2; i++) {
        const btn = document.getElementById(`l-btn-${i}`);
        if (i === layoutNum) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    };

    function loadExchangedPals() {
      currentPalsData = dummyPals.map((pal, index) => {
        const theme = customThemes[index % customThemes.length];
        return {
          ...pal,
          theme: theme,
          images: pal.images
        };
      });

      currentPalsData.forEach(pal => {
        pal.isUpdated = Math.random() < 0.35; 
      });

      renderList();
    }

    function renderList() {
      const container = document.getElementById('pals-list-container');
      container.innerHTML = '';

      currentPalsData.forEach((pal, index) => {
        const badgeHtml = pal.isUpdated ? `<div class="new-badge">❗️</div>` : '';
        const t = pal.theme;

        const itemBox = document.createElement('div');
        itemBox.innerHTML = `
          <div class="palcard-container" onclick="openPalDetail(${index})">
            ${badgeHtml}
            <div class="palcard-flipper">
              <div class="palcard" style="background: ${t.cardBg}; border-color: ${t.cardBorder}; border-radius: ${t.radiusCard};">
                <div class="palcard-brand">PALCARD</div>
                <div class="palcard-body">
                  <div class="profile-info">
                    <div class="user-title-display">${pal.title || 'PAL'}</div>
                    <div class="pet-name">${pal.name || 'ANONYMOUS'}</div>
                    <div class="profile-fields">
                      <div class="field-row"><span class="field-label">生年月日</span><div class="field-value">${pal.birth || '-'}</div></div>
                      <div class="field-row"><span class="field-label">nickname</span><div class="field-value">${pal.nickname || '-'}</div></div>
                      <div class="field-row"><span class="field-label">message</span><div class="field-value">${pal.ownerMessage || '-'}</div></div>
                      <div class="field-row"><span class="field-label">pallike</span><div class="field-value" style="color:var(--gold); font-weight:bold;">♡ ${pal.pallike || '0'}</div></div>
                    </div>
                  </div>
                  <div class="right-avatar-container">
                    <div class="avatar-wrapper" style="background: ${t.avatarBg};">
                      <div class="avatar-inner"><img src="${pal.avatar || ''}"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(itemBox.firstElementChild);
      });
    }

    window.openPalDetail = function(index) {
      const pal = currentPalsData[index];
      if (!pal) return;

      if (pal.isUpdated) {
        pal.isUpdated = false;
      }

      const detailArea = document.getElementById('detail-content-area');
      const t = pal.theme;
      
      let gridHtml = '';
      gridLabelsStatic.forEach((lbl, i) => {
        const labelText = (i === 2) ? (pal.freeLabel || 'FREE') : lbl;
        const isPalmel = (i === 8);
        const palmelClass = isPalmel ? ' palmel-item' : '';
        const palmelLogo = isPalmel ? `<div class="palmel-overlay-logo">PALMEL</div>` : '';
        const imgSrc = (pal.images && pal.images[i]) ? pal.images[i] : '';
        const imgTag = imgSrc ? `<img src="${imgSrc}" class="has-image">` : `<img src="">`;

        gridHtml += `
          <div class="grid-item${palmelClass}">
            <div class="grid-label">${labelText}</div>
            <div class="grid-image-box">
              ${imgTag}
              ${palmelLogo}
            </div>
          </div>
        `;
      });

      detailArea.innerHTML = `
        <div class="palcard-container" onclick="this.classList.toggle('flipped')">
          <div class="palcard-flipper">
            <!-- 表面 -->
            <div class="palcard" style="background: ${t.cardBg}; border-color: ${t.cardBorder}; border-radius: ${t.radiusCard};">
              <div class="palcard-brand">PALCARD</div>
              <div class="palcard-body">
                <div class="profile-info">
                  <div class="user-title-display">${pal.title || 'PAL'}</div>
                  <div class="pet-name">${pal.name || 'ANONYMOUS'}</div>
                  <div class="profile-fields">
                    <div class="field-row"><span class="field-label">生年月日</span><div class="field-value">${pal.birth || '-'}</div></div>
                    <div class="field-row"><span class="field-label">nickname</span><div class="field-value">${pal.nickname || '-'}</div></div>
                    <div class="field-row"><span class="field-label">message</span><div class="field-value">${pal.ownerMessage || '-'}</div></div>
                    <div class="field-row"><span class="field-label">pallike</span><div class="field-value" style="color:var(--gold); font-weight:bold;">♡ ${pal.pallike || '0'}</div></div>
                  </div>
                </div>
                <div class="right-avatar-container">
                  <div class="avatar-wrapper" style="background: ${t.avatarBg};">
                    <div class="avatar-inner"><img src="${pal.avatar || ''}"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 裏面 -->
            <div class="palcard palcard-back" style="background: ${t.cardBg}; border-color: ${t.cardBorder}; border-radius: ${t.radiusCard};">
              <div class="palcard-brand">PALCARD</div>
              <div class="back-content">
                <div>
                  <div class="back-owner-title">OWNER NAME</div>
                  <div class="back-owner-name">${pal.ownerName || 'OWNER'}</div>
                </div>
              </div>
              <div style="text-align: center;">
                <span style="font-size: 0.48rem; color: var(--text-sub); letter-spacing: 0.1em; opacity: 0.7;">もう一度タップして表面に戻る</span>
              </div>
            </div>
          </div>
        </div>

        <div class="grid-container" id="swipe-target-grid">
          ${gridHtml}
        </div>
      `;

      document.getElementById('screen-list').classList.remove('active');
      document.getElementById('screen-detail').classList.add('active');
      
      const viewport = document.querySelector('.app-viewport');
      if (viewport) viewport.scrollTop = 0;

      setupSwipeBack();
    };

    window.showListScreen = function() {
      document.getElementById('screen-detail').classList.remove('active');
      document.getElementById('screen-list').classList.add('active');
      
      const viewport = document.querySelector('.app-viewport');
      if (viewport) viewport.scrollTop = 0;
      
      renderList();
    };

    function setupSwipeBack() {
      const gridContainer = document.getElementById('swipe-target-grid');
      if (!gridContainer) return;

      let touchStartX = 0;
      let touchStartY = 0;

      gridContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      gridContainer.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const diffX = touchEndX - touchStartX;
        const diffY = Math.abs(touchEndY - touchStartY);

        if (diffX > 70 && diffY < 50) {
          showListScreen();
        }
      }, { passive: true });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadExchangedPals();
    });
  </script>
</body>
</html>
