<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mypal-mode">

  <!-- ドロワーメニュー -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  
  <aside id="side-drawer" class="side-drawer">
    <div>
      <div class="drawer-header">
        <span class="drawer-title">SETTINGS</span>
        <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-menu-list">
        <button class="drawer-item" onclick="toggleModal('account-modal', true); closeDrawer();">👤 アカウント・プロフ設定</button>
        <a href="customize.html" class="drawer-item">🎨 デザイン着せ替え</a>
        <button class="drawer-item" onclick="alert('通知設定'); closeDrawer();">🔔 通知設定</button>
        <button class="drawer-item" onclick="alert('プライバシー設定'); closeDrawer();">🔒 プライバシー・セキュリティ</button>
        <button class="drawer-item" onclick="alert('ヘルプ'); closeDrawer();">❓ ヘルプ＆サポート</button>
      </div>
    </div>
    <button class="drawer-item" style="color: #ff6b6b; border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.05);" onclick="alert('ログアウトしました'); closeDrawer();">🚪 ログアウト</button>
  </aside>

  <div class="app-viewport">
    
    <!-- マイパル ページ -->
    <div id="page-mypal" class="page active">

      <!-- 名刺カード -->
      <div class="palcard" id="main-palcard">
        <div class="palcard-brand">PALFILE</div>
        <div class="palcard-body">
          <div class="profile-info">
            <input type="text" id="in-title" class="title-input" value="FOUNDER" readonly>
            <input type="text" id="in-name" class="pet-name" value="MEL">
            <div class="profile-fields">
              <div class="field-row"><span class="field-label">生年月日</span><input type="text" id="in-birth" class="field-input" value="2026.02.10"></div>
              <div class="field-row"><span class="field-label">好物</span><input type="text" id="in-food" class="field-input" value="ささみ / まぐろ"></div>
              <div class="field-row"><span class="field-label">特技</span><input type="text" id="in-skill" class="field-input" value="どこでも寝れる"></div>
              <div class="field-row"><span class="field-label">ニックネーム</span><input type="text" id="in-nickname" class="field-input" value="メルちゃん"></div>
            </div>
          </div>
          <div class="right-avatar-container">
            <label class="avatar-wrapper" id="main-avatar-wrapper">
              <div class="avatar-inner"><img id="avatar-img" src="https://picsum.photos/id/1025/300/300"></div>
              <input type="file" accept="image/*" onchange="previewImg(this, 'avatar-img')">
            </label>
          </div>
        </div>
        <div class="palcard-footer">
          <div class="footer-left-group">
            <button class="icon-btn" onclick="presentCard()"><span>名刺を渡す</span></button>
            <label class="icon-btn" style="cursor:pointer;">
              <span>名刺を受け取る</span>
              <input type="file" accept="image/*" capture="environment" onchange="alert('名刺を受け取りました！')">
            </label>
          </div>
          <div class="sns-links-container">
            <a id="btn-sns-instagram" href="#" target="_blank" class="sns-btn" title="Instagram">📸</a>
            <a id="btn-sns-x" href="#" target="_blank" class="sns-btn" title="X (Twitter)">𝕏</a>
          </div>
        </div>
      </div>

      <!-- 9マス Grid -->
      <div class="grid-container" id="main-grid-container"></div>

    </div>

    <!-- みんなのパル ページ -->
    <div id="page-feed" class="page">
      <h2 style="font-family:'Cinzel'; color:var(--gold); font-size:1.1rem; text-align:center;">EVERYONE'S PAL</h2>
      
      <button class="action-btn-main" onclick="postToPublicFeed()">投稿する</button>

      <div id="feed-container" style="display:flex; flex-direction:column; gap:16px;"></div>
      <div id="scroll-marker" class="loading-tag">パルを読み込み中...</div>
      
      <div class="nav-spacer"></div>
    </div>

  </div>

  <!-- モーダル類 -->
  <div id="history-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px; color:var(--gold);">ALBUM</h3>
      
      <div class="album-current-section">
        <div class="album-section-title">
          <span>📸 現在のマイパル 9マス</span>
          <span style="font-size:0.6rem; color:var(--text-sub); font-weight:normal;">自動更新中</span>
        </div>
        <div class="mini-grid-container" id="current-grid-preview"></div>
        <button class="action-btn-main" style="margin-top:10px;" onclick="saveCurrentGridOnly()">現在の9マスを保存</button>
      </div>

      <div class="album-section-title" style="margin-bottom:10px;">
        <span>📅 保存された過去の9マス</span>
      </div>

      <div id="album-list">
        <p style="font-size:0.75rem; color:var(--text-sub);">保存された過去の9マスはありません。</p>
      </div>
      
      <button style="margin-top:16px; background:none; border:none; color:var(--gold); cursor:pointer; width:100%; text-align:center;" onclick="toggleModal('history-modal', false)">閉じる</button>
    </div>
  </div>

  <div id="account-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px; color:var(--gold);">ACCOUNT & PROFILE</h3>
      <div style="margin-top:14px;">
        <div class="form-group">
          <label class="form-label">Instagram ID (例: username)</label>
          <input type="text" id="acc-instagram" class="form-input" placeholder="ユーザー名を入力">
        </div>
        <div class="form-group">
          <label class="form-label">X (Twitter) ID (例: username)</label>
          <input type="text" id="acc-x" class="form-input" placeholder="ユーザー名を入力">
        </div>
      </div>
      <button style="margin-top:16px; width:100%; padding:10px; background:var(--gold); border:none; border-radius:10px; color:#000; font-weight:bold; cursor:pointer;" onclick="saveAccountSettings()">保存する</button>
    </div>
  </div>

  <div id="user-profile-modal" class="user-profile-modal">
    <div class="profile-modal-container">
      <button class="close-modal-btn" onclick="closeUserProfile()">✕</button>
      <div class="palcard">
        <div class="palcard-brand">PALFILE</div>
        <div class="palcard-body">
          <div class="profile-info">
            <div id="target-title" class="title-input"></div>
            <div id="target-name" class="pet-name"></div>
            <div class="profile-fields">
              <div class="field-row"><span class="field-label">生年月日</span><div id="target-birth" class="field-input">2024.05.12</div></div>
              <div class="field-row"><span class="field-label">好物</span><div id="target-food" class="field-input">チュール / チキン</div></div>
              <div class="field-row"><span class="field-label">特技</span><div id="target-skill" class="field-input">ハイタッチ</div></div>
              <div class="field-row"><span class="field-label">ニックネーム</span><div id="target-nickname" class="field-input">ココちゃん</div></div>
            </div>
          </div>
          <div class="right-avatar-container">
            <div class="avatar-wrapper">
              <div class="avatar-inner"><img id="target-avatar" src=""></div>
            </div>
          </div>
        </div>
        <div class="palcard-footer">
          <button class="icon-btn" onclick="alert('名刺を交換しました！')"><span>名刺交換</span></button>
        </div>
      </div>
      <div class="grid-container" id="target-grid-container"></div>
      <div class="nav-spacer"></div>
    </div>
  </div>

  <div id="card-present-modal" class="card-present-overlay" onclick="closePresentCard()">
    <div class="card-present-wrapper" id="present-card-container"></div>
    <div class="card-present-tip">タップして閉じる</div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="btn-mypal" onclick="switchTab('mypal')">🏠 マイパル</button>
    <button class="nav-btn" onclick="openAlbumModal()">📖 アルバム</button>
    <button class="nav-btn" onclick="toggleModal('exchanged-modal', true)">🎴 名刺/9マス</button>
    <button class="nav-btn" id="btn-feed" onclick="switchTab('feed')">🐾 みんなのパル</button>
  </nav>

  <div id="exchanged-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px;">EXCHANGED CARDS</h3>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-top:12px;">交換した名刺や9マスがここに溜まります。</p>
      <button style="margin-top:16px; background:none; border:none; color:var(--gold); cursor:pointer;" onclick="toggleModal('exchanged-modal', false)">閉じる</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
