<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PARMEL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255,255,255,0.08);
      --card-shadow:
        0 12px 32px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.15);
      --avatar-bg: linear-gradient(
        135deg,
        rgba(255,255,255,0.3),
        rgba(255,255,255,0.05)
      );
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --green: #52a397;
      --radius-card: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        calc(30px + env(safe-area-inset-bottom));
    }

    /* =========================
       HOME CONTAINER
    ========================= */

    .app-viewport {
      width: 100%;
      max-width: 414px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* =========================
       PALCARD
    ========================= */

    .palcard {
      position: relative;
      width: 100%;
      aspect-ratio: 1.655 / 1;

      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1px solid var(--card-border);

      padding: 12px 14px;

      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      overflow: hidden;
    }

    .palcard-brand {
      font-family: 'Cinzel', serif;
      font-size: clamp(10px, 2.6vw, 13px);
      letter-spacing: 0.32em;
      color: var(--text-sub);
      font-weight: 600;
      text-align: center;
      line-height: 1;
    }

    .palcard-body {
      width: 100%;
      flex: 1;
      min-height: 0;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 8px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-info {
      flex: 1;
      min-width: 0;
      height: 100%;

      display: flex;
      flex-direction: column;

      margin-top: 5px;
      overflow: hidden;
    }

    .title-input {
      width: 100%;

      background: transparent;
      border: none;
      outline: none;

      color: var(--gold);

      font-size: clamp(9px, 2.5vw, 11px);
      font-weight: 500;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pet-name {
      width: 100%;

      background: transparent;
      border: none;
      outline: none;

      color: #fff;

      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 8vw, 35px);
      font-weight: 700;

      line-height: 0.95;

      margin-bottom: 4px;

      text-shadow: 0 2px 4px rgba(0,0,0,0.5);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-fields {
      display: flex;
      flex-direction: column;
      gap: 2px;

      min-width: 0;
    }

    .field-row {
      width: 100%;

      display: flex;
      align-items: center;

      border-bottom: 1px solid rgba(255,255,255,0.06);

      padding-bottom: 1px;
    }

    .field-label {
      width: 55px;
      flex-shrink: 0;

      color: var(--text-sub);

      font-size: clamp(7px, 1.9vw, 9px);

      white-space: nowrap;
    }

    .field-input {
      width: 100%;
      min-width: 0;

      background: transparent;
      border: none;
      outline: none;

      color: var(--text-main);

      font-size: clamp(8px, 2.1vw, 10px);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       AVATAR
    ========================= */

    .right-avatar-container {
      position: relative;

      width: 41%;
      max-width: 155px;

      flex-shrink: 0;

      display: flex;
      justify-content: flex-end;
      align-items: flex-end;

      height: 100%;
    }

    .avatar-wrapper {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      border-radius: 50%;

      padding: 3px;

      margin-bottom: -12px;

      background: var(--avatar-bg);

      box-shadow: 0 6px 16px rgba(0,0,0,0.5);

      cursor: pointer;

      transition: transform 0.2s;
    }

    .avatar-wrapper:active {
      transform: scale(0.96);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;

      border-radius: 50%;
      overflow: hidden;

      background: #1a1d20;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* =========================
       CUSTOMIZE BUTTON
    ========================= */

    .customize-btn {
      position: absolute;

      right: 10px;
      bottom: 9px;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: rgba(30,34,40,0.95);

      border: 1px solid rgba(255,255,255,0.3);

      color: var(--gold);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      cursor: pointer;

      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .customize-btn:active {
      transform: scale(0.9);
    }

    /* =========================
       FOOTER BUTTONS
    ========================= */

    .palcard-footer {
      position: absolute;

      left: 14px;
      bottom: 8px;

      display: flex;
      align-items: center;

      gap: 8px;
    }

    .icon-btn {
      width: 47px;
      height: 47px;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.18);

      border-radius: 11px;

      color: var(--text-main);

      font-size: 7px;
      font-weight: 500;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      cursor: pointer;

      text-align: center;

      line-height: 1.1;
    }

    .icon-btn:active {
      transform: scale(0.94);
      background: rgba(255,255,255,0.15);
    }

    .trophy-icon-btn {
      width: 47px;
      height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #c0c0c0;

      pointer-events: none;

      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* =========================
       9 GRID
    ========================= */

    .grid-container {
      width: 100%;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 5px;
    }

    .grid-item {
      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1.25;

      background: #15181b;

      border-radius: 8px;

      overflow: hidden;

      border: 1px solid rgba(255,255,255,0.04);

      display: flex;
      flex-direction: column;
    }

    .grid-label {
      flex-shrink: 0;

      font-family: 'Cinzel', serif;

      font-size: clamp(7px, 2vw, 9px);

      letter-spacing: 0.08em;

      text-align: center;

      padding: 4px 2px;

      background: rgba(0,0,0,0.4);

      color: var(--text-sub);

      white-space: nowrap;
      overflow: hidden;
    }

    .grid-image-box {
      position: relative;

      flex: 1;

      width: 100%;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .grid-image-box img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: none;
    }

    .upload-placeholder {
      font-size: clamp(18px, 5vw, 24px);

      color: var(--text-sub);

      opacity: 0.3;
    }

    input[type="file"] {
      display: none;
    }

    /* =========================
       BRAND FOOTER
    ========================= */

    .brand-footer {
      text-align: center;

      font-family: 'Cinzel', serif;

      letter-spacing: 0.35em;

      color: var(--green);

      font-size: 14px;

      margin-top: 0;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      display: none;

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(5,6,7,0.95);

      backdrop-filter: blur(12px);

      z-index: 9999;

      justify-content: center;
      align-items: center;

      opacity: 0;

      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* =========================
       ROTATED CARD
    ========================= */

    .card-rotated {
      position: relative;

      width: min(86vw, 680px);
      height: min(52vw, 380px);

      aspect-ratio: 1.655 / 1;

      transform: rotate(90deg);

      background: var(--card-bg);

      border-radius: 24px;

      padding: 20px 28px 24px;

      border: 1px solid var(--card-border);

      box-shadow: 0 0 60px rgba(0,0,0,0.9);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      pointer-events: none;
    }

    .rotated-body {
      display: flex;

      justify-content: space-between;

      align-items: center;

      height: 100%;

      gap: 20px;

      margin-top: 8px;
    }

    .rotated-left {
      flex: 1;

      display: flex;
      flex-direction: column;

      justify-content: space-around;

      height: 100%;
    }

    #m-title {
      color: var(--gold);
      font-size: clamp(11px, 3vw, 18px);
      font-weight: 600;
    }

    #m-name {
      font-family: 'Cinzel', serif;

      font-size: clamp(30px, 9vw, 58px);

      font-weight: 700;

      line-height: 1;

      color: #fff;
    }

    .rotated-fields {
      font-size: clamp(10px, 2.7vw, 17px);

      color: var(--text-sub);

      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .rotated-fields span {
      color: #fff;
    }

    .rotated-right {
      width: clamp(90px, 24vw, 150px);

      display: flex;
      flex-direction: column;

      align-items: center;

      justify-content: space-between;

      height: 100%;
    }

    .rotated-avatar {
      width: clamp(80px, 22vw, 130px);
      height: clamp(80px, 22vw, 130px);

      border-radius: 50%;

      overflow: hidden;

      padding: 3px;

      background: var(--avatar-bg);
    }

    .rotated-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;
    }

    .dummy-qr {
      width: clamp(70px, 19vw, 110px);
      height: clamp(70px, 19vw, 110px);

      background: #fff;

      padding: 6px;

      border-radius: 12px;
    }

    .dummy-qr img {
      width: 100%;
      height: 100%;
    }

    .close-hint {
      position: absolute;

      bottom: -42px;

      left: 50%;

      transform: translateX(-50%);

      color: var(--text-sub);

      font-size: 12px;

      white-space: nowrap;
    }

    /* =========================
       NORMAL MODALS
    ========================= */

    .modal-content {
      width: calc(100% - 32px);

      max-width: 380px;

      background: #16181b;

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: var(--radius-card);

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .modal-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      border-bottom: 1px solid rgba(255,255,255,0.1);

      padding-bottom: 8px;

      font-family: 'Cinzel', serif;
    }

    .close-btn {
      background: none;

      border: none;

      color: var(--text-sub);

      font-size: 1.2rem;

      cursor: pointer;
    }

    .custom-section {
      display: flex;
      flex-direction: column;

      gap: 6px;

      font-size: 0.75rem;

      color: var(--text-sub);
    }

    .option-group {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .color-opt {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      cursor: pointer;

      border: 2px solid transparent;
    }

    .color-opt.selected {
      border-color: #fff;

      transform: scale(1.08);
    }

    .title-opt {
      padding: 5px 10px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.15);

      border-radius: 20px;

      color: #fff;

      font-size: 0.7rem;

      cursor: pointer;
    }

    .title-opt.selected {
      background: var(--gold);

      color: #000;

      font-weight: bold;
    }

    /* =========================
       SMALL SCREEN
    ========================= */

    @media (max-width: 360px) {

      body {
        padding-left: 8px;
        padding-right: 8px;
      }

      .app-viewport {
        gap: 11px;
      }

      .palcard {
        padding: 10px 11px;
      }

      .palcard-footer {
        left: 11px;
        bottom: 7px;
        gap: 6px;
      }

      .icon-btn,
      .trophy-icon-btn {
        width: 42px;
        height: 42px;
      }

      .right-avatar-container {
        width: 39%;
      }

      .field-label {
        width: 48px;
      }

      .grid-container {
        gap: 4px;
      }

      .grid-item {
        border-radius: 6px;
      }
    }

    /* =========================
       TALL PHONE
    ========================= */

    @media (min-height: 800px) and (max-width: 500px) {

      .app-viewport {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="app-viewport">

    <!-- =========================
         PALCARD
    ========================= -->

    <section class="palcard" id="main-palcard">

      <div class="palcard-brand">
        PALFILE
      </div>

      <div class="palcard-body">

        <div class="profile-info">

          <input
            type="text"
            id="in-title"
            class="title-input"
            value="★ 甘えん坊将軍"
            readonly
          >

          <input
            type="text"
            id="in-name"
            class="pet-name"
            value="MEL"
          >

          <div class="profile-fields">

            <div class="field-row">
              <span class="field-label">生年月日</span>
              <input
                type="text"
                id="in-birth"
                class="field-input"
                value="2026.02.10"
              >
            </div>

            <div class="field-row">
              <span class="field-label">好きな食べ物</span>
              <input
                type="text"
                id="in-food"
                class="field-input"
                value="ささみ / まぐろ"
              >
            </div>

            <div class="field-row">
              <span class="field-label">特技</span>
              <input
                type="text"
                id="in-skill"
                class="field-input"
                value="どこでも寝れる"
              >
            </div>

            <div class="field-row">
              <span class="field-label">ニックネーム</span>
              <input
                type="text"
                id="in-nick"
                class="field-input"
                value="パルちゃん"
              >
            </div>

          </div>
        </div>

        <!-- AVATAR -->

        <div class="right-avatar-container">

          <label
            class="avatar-wrapper"
            id="main-avatar-wrapper"
          >

            <div class="avatar-inner">
              <img
                id="avatar-img"
                src="https://placehold.co/300x300/222/aaa?text=Photo"
                alt="Profile"
              >
            </div>

            <input
              type="file"
              accept="image/*"
              onchange="previewImg(this,'avatar-img')"
            >

          </label>

        </div>

        <!-- CUSTOMIZE -->

        <button
          class="customize-btn"
          onclick="toggleModal('custom-modal',true)"
        >

          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 2a3 3 0 0 0-3 3c0 .8.3 1.5.8 2.1L2 14v3h20v-3l-7.8-6.9c.5-.6.8-1.3.8-2.1a3 3 0 0 0-3-3z"/>
          </svg>

        </button>

      </div>

      <!-- FOOTER BUTTONS -->

      <div class="palcard-footer">

        <button
          class="icon-btn"
          onclick="openCardModal()"
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-10 7L2 7"/>
          </svg>

          <span>名刺を渡す</span>

        </button>

        <button
          class="icon-btn"
          onclick="toggleModal('history-modal',true)"
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>

          <span>過去投稿</span>

        </button>

        <div class="trophy-icon-btn">

          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"/>
          </svg>

        </div>

      </div>

    </section>


    <!-- =========================
         9 GRID
    ========================= -->

    <section class="grid-container" id="grid-container">

      <script>

        const labels = [
          'MONTHLY',
          'CHARMPOINT',
          'FREE',
          'FOOD',
          'MAIN',
          'SLEEPING',
          'TOYS',
          'FUNNYSHOT',
          'QR'
        ];

        document.write(
          labels.map((lbl,i) => `
            <div class="grid-item">

              <div class="grid-label">
                ${lbl}
              </div>

              <label class="grid-image-box">

                <img
                  id="g${i}"
                  alt=""
                >

                <span class="upload-placeholder">
                  +
                </span>

                <input
                  type="file"
                  accept="image/*"
                  onchange="previewGrid(this,'g${i}')"
                >

              </label>

            </div>
          `).join('')
        );

      </script>

    </section>


    <div class="brand-footer">
      PARMEL
    </div>

  </main>


  <!-- =========================
       CARD MODAL
  ========================= -->

  <div
    id="card-modal"
    class="modal-overlay"
    onclick="toggleModal('card-modal',false)"
  >

    <div
      class="card-rotated"
      id="modal-palcard"
    >

      <div class="palcard-brand">
        PALFILE
      </div>

      <div class="rotated-body">

        <div class="rotated-left">

          <div>

            <div id="m-title"></div>

            <div id="m-name"></div>

          </div>

          <div class="rotated-fields">

            <div>
              生年月日:
              <span id="m-birth"></span>
            </div>

            <div>
              好きな食べ物:
              <span id="m-food"></span>
            </div>

            <div>
              特技:
              <span id="m-skill"></span>
            </div>

            <div>
              ニックネーム:
              <span id="m-nick"></span>
            </div>

          </div>

        </div>

        <div class="rotated-right">

          <div
            class="rotated-avatar"
            id="modal-avatar-wrapper"
          >

            <img
              id="m-avatar"
              src=""
              alt=""
            >

          </div>

          <div class="dummy-qr">

            <img
              src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://aya7oo4-tails.github.io/PALMEL/"
              alt="QR"
            >

          </div>

        </div>

      </div>

      <div class="close-hint">
        画面のどこでもタップして閉じる
      </div>

    </div>

  </div>


  <!-- =========================
       HISTORY MODAL
  ========================= -->

  <div
    id="history-modal"
    class="modal-overlay"
  >

    <div class="modal-content">

      <div class="modal-header">

        <span>PAST POSTS</span>

        <button
          class="close-btn"
          onclick="toggleModal('history-modal',false)"
        >
          ✕
        </button>

      </div>

      <div
        style="
          text-align:center;
          color:var(--text-sub);
          font-size:0.8rem;
          padding:30px 0;
        "
      >
        保存された過去の9マス投稿はありません
      </div>

    </div>

  </div>


  <!-- =========================
       CUSTOM MODAL
  ========================= -->

  <div
    id="custom-modal"
    class="modal-overlay"
  >

    <div class="modal-content">

      <div class="modal-header">

        <span>DRESS-UP / CUSTOMIZE</span>

        <button
          class="close-btn"
          onclick="toggleModal('custom-modal',false)"
        >

  <script>

    function toggleModal(id,show){

      const el = document.getElementById(id);

      if(show){

        el.style.display = 'flex';

        setTimeout(
          () => el.classList.add('active'),
          10
        );

      }else{

        el.classList.remove('active');

        setTimeout(
          () => el.style.display = 'none',
          200
        );

      }

    }


    function previewImg(input,targetId){

      if(
        input.files &&
        input.files[0]
      ){

        const r = new FileReader();

        r.onload = e => {

          document.getElementById(targetId).src =
            e.target.result;

        };

        r.readAsDataURL(
          input.files[0]
        );

      }

    }


    function previewGrid(input,imgId){

      if(
        input.files &&
        input.files[0]
      ){

        const r = new FileReader();

        r.onload = e => {

          const img =
            document.getElementById(imgId);

          img.src =
            e.target.result;

          img.style.display =
            'block';

          input
            .parentElement
            .querySelector(
              '.upload-placeholder'
            )
            .style.display =
            'none';

        };

        r.readAsDataURL(
          input.files[0]
        );

      }

    }


    function openCardModal(){

      [
        'title',
        'name',
        'birth',
        'food',
        'skill',
        'nick'
      ].forEach(k => {

        document.getElementById(`m-${k}`).innerText =
          document.getElementById(`in-${k}`).value;

      });

      document.getElementById(
        'm-avatar'
      ).src =
        document.getElementById(
          'avatar-img'
        ).src;

      toggleModal(
        'card-modal',
        true
      );

    }


    function setTitle(val,el){

      document.getElementById(
        'in-title'
      ).value = val;

      updateSel(el);

    }


    function setTheme(type,val,el){

      if(type === 'bg'){

        document.getElementById(
          'main-palcard'
        ).style.background = val;

        document.getElementById(
          'modal-palcard'
        ).style.background = val;

      }

      else if(type === 'frame'){

        document.getElementById(
          'main-avatar-wrapper'
        ).style.background = val;

        document.getElementById(
          'modal-avatar-wrapper'
        ).style.background = val;

      }

      updateSel(el);

    }


    function updateSel(el){

      Array.from(
        el.parentElement.children
      ).forEach(
        c => c.classList.remove('selected')
      );

      el.classList.add('selected');

    }

  </script>
