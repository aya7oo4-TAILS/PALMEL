<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      --avatar-bg: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px 12px 0px;
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page { display: none; flex-direction: column; gap: 16px; width: 100%; }
    .page.active { display: flex; }

    .action-btn-main {
      width: 100%; background: linear-gradient(135deg, var(--gold), #d4a359);
      color: #000; font-weight: bold; border: none; border-radius: 20px;
      padding: 12px 0; font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 12px rgba(229,192,123,0.3); text-align: center;
    }

    /* 名刺カードデザイン */
    .palcard {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 12px 14px 40px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
      position: relative;
      aspect-ratio: 1.655 / 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .palcard.theme-navy {
      background: linear-gradient(135deg, #1b263b 0%, #0d1b2a 100%);
    }

    .palcard.theme-emerald { background: linear-gradient(135deg, #0d3b2e 0%, #051a14 100%) !important; }
    .palcard.theme-wine { background: linear-gradient(135deg, #3b1b26 0%, #1a050d 100%) !important; }
    .palcard.theme-gold { background: linear-gradient(135deg, #3d321d 0%, #1c160b 100%) !important; border-color: rgba(229, 192, 123, 0.5) !important; }

    .palcard-brand { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.35em; color: var(--text-sub); font-weight: 600; text-align: center; margin-bottom: 6px; }
    .palcard-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex: 1; }
    
    .profile-info { flex: 1; display: flex; flex-direction: column; min-width: 0; justify-content: flex-start; padding-top: 0px; margin-top: -4px; }
    .title-input { font-size: 0.68rem; color: var(--gold); background: transparent; border: none; outline: none; font-weight: 500; margin-bottom: 1px; line-height: 1.2; }
    .pet-name { font-family: 'Cinzel', serif; font-size: 1.7rem; line-height: 1.1; margin-bottom: 6px; font-weight: 700; color: #fff; border: none; background: transparent; outline: none; }
    
    .profile-fields { display: flex; flex-direction: column; gap: 4px; }
    .field-row { display: flex; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 2px; }
    .field-label { font-size: 0.58rem; color: var(--text-sub); width: 60px; flex-shrink: 0; }
    .field-input { background: transparent; border: none; color: var(--text-main); font-size: 0.65rem; outline: none; width: 100%; font-weight: 500; }

    .right-avatar-container { 
      position: relative; 
      width: 140px; 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-top: 10px;
    }
    .avatar-wrapper { width: 138px; height: 138px; border-radius: 50%; padding: 3px; background: var(--avatar-bg); cursor: pointer; display: block; transition: all 0.3s ease; }
    
    .avatar-wrapper.frame-gold {
      background: linear-gradient(135deg, #ffe066 0%, #e5c07b 50%, #b38600 100%);
      box-shadow: 0 0 12px rgba(229, 192, 123, 0.5);
    }

    .avatar-wrapper.frame-silver {
      background: linear-gradient(135deg, #ffffff 0%, #a8b2c1 50%, #6c757d 100%) !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3) !important;
    }
    .avatar-wrapper.frame-neon {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%) !important;
      box-shadow: 0 0 16px rgba(79, 172, 254, 0.7) !important;
    }

    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1d20; }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

    .palcard-footer { position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
    .footer-left-group { display: flex; gap: 6px; }
    .icon-btn {
      height: 28px; padding: 0 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.22); 
      border-radius: 8px; color: var(--text-main); font-size: 0.55rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 500; text-decoration: none;
    }

    .sns-links-container { display: flex; gap: 6px; align-items: center; }
    .sns-btn {
      display: none; height: 28px; width: 28px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px; color: var(--text-main); font-size: 0.75rem; align-items: center; justify-content: center; text-decoration: none;
    }
    .sns-btn.active { display: flex; }

    /* 9マス Grid */
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
    .grid-item { background: #15181b; border-radius: 8px; display: flex; flex-direction: column; aspect-ratio: 1 / 1.25; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); }
    .grid-label { font-family: 'Cinzel', 'Noto Sans JP', serif; font-size: 0.58rem; letter-spacing: 0.1em; text-align: center; padding: 4px 2px; background: rgba(0, 0, 0, 0.4); color: var(--text-sub); display: flex; align-items: center; justify-content: center; }
    
    .grid-label-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(229, 192, 123, 0.5);
      color: var(--gold);
      font-family: inherit;
      font-size: 0.58rem;
      text-align: center;
      width: 90%;
      outline: none;
      letter-spacing: 0.05em;
      font-weight: bold;
    }
    .grid-label-input::placeholder { color: rgba(229, 192, 123, 0.4); }
    .grid-label-input:focus { border-bottom-color: var(--gold); background: rgba(0, 0, 0, 0.3); }

    .grid-image-box { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .grid-image-box img { width: 100%; height: 100%; object-fit: cover; }
    input[type="file"] { display: none; }

    /* フィード投稿カード */
    .feed-post-card {
      background: #16181b; border-radius: var(--radius-card); border: 1px solid var(--card-border);
      padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s ease;
    }
    .feed-post-card:active { transform: scale(0.99); }
    
    .feed-header { display: flex; align-items: center; gap: 10px; }
    .feed-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); flex-shrink: 0; }
    .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .feed-user-info { display: flex; flex-direction: column; }
    .feed-pet-name { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.1; }
    .feed-title { font-size: 0.6rem; color: var(--gold); }

    .single-media-box { width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.05); }
    .single-media-box img { width: 100%; height: 100%; object-fit: cover; }
    .mini-grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; border-radius: 12px; overflow: hidden; }
    .mini-grid-item { aspect-ratio: 1; background: #202428; overflow: hidden; }
    .mini-grid-item img { width: 100%; height: 100%; object-fit: cover; }

    /* モーダル共通 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(5, 6, 7, 0.95); backdrop-filter: blur(12px); z-index: 9999; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #16181b; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: var(--radius-card); width: 90%; max-width: 380px; padding: 20px; max-height: 85vh; overflow-y: auto; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-label { font-size: 0.7rem; color: var(--text-sub); }
    .form-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.8rem; outline: none; }
    .form-input:focus { border-color: var(--gold); }

    .user-profile-modal { display: none; position: fixed; inset: 0; background: #0b0d0e; z-index: 10000; overflow-y: auto; padding: 16px 12px 100px; }
    .user-profile-modal.active { display: flex; flex-direction: column; align-items: center; }
    .profile-modal-container { width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .close-modal-btn {
      position: absolute; right: 0; top: -5px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 50%; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    .nav-spacer { width: 100%; height: 90px; flex-shrink: 0; }

    /* 固定ボトムナビ */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 9000;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; }
    .nav-btn.active { color: var(--gold); }

    .loading-tag { text-align: center; color: var(--text-sub); font-size: 0.8rem; padding: 20px; }
    
    /* アルバムモーダル専用スタイル */
    .album-current-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(229, 192, 123, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      margin-bottom: 20px;
    }
    .album-section-title {
      font-size: 0.75rem; color: var(--gold); font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
    }
    .album-history-item { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 16px; }
    .album-date { font-size: 0.72rem; color: var(--text-sub); margin-bottom: 8px; }

    /* 名刺プレビューモーダル */
    .card-present-overlay {
      display: none; position: fixed; inset: 0; background: rgba(5, 6, 7, 0.92);
      backdrop-filter: blur(16px); z-index: 20000; justify-content: center; align-items: center; cursor: pointer;
    }
    .card-present-overlay.active { display: flex; }
    .card-present-wrapper {
      width: 360px; transition: transform 0.4s cubic-bezier(0.25, 1.3, 0.5, 1);
      transform: rotate(0deg) scale(0.7); opacity: 0;
    }
    .card-present-overlay.active .card-present-wrapper { transform: rotate(90deg) scale(1.45); opacity: 1; }
    .card-present-tip { position: absolute; bottom: 40px; color: var(--text-sub); font-size: 0.75rem; letter-spacing: 0.1em; pointer-events: none; }

    /* ドロワーメニュー */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px); z-index: 25000; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: auto; }

    .side-drawer {
      position: fixed; top: 0; left: 0; width: 280px; height: 100%;
      background: #14171a; border-right: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 26000; transform: translateX(-100%);
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      will-change: transform;
    }
    .side-drawer.animated { transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .side-drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .drawer-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 0.9rem; font-weight: bold; letter-spacing: 0.1em; }
    .drawer-close-btn { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .drawer-menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .drawer-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: var(--text-main); font-size: 0.8rem;
      cursor: pointer; text-align: left; transition: background 0.2s ease; text-decoration: none;
    }
    .drawer-item:active { background: rgba(229,192,123,0.15); border-color: var(--gold); }
  </style>
</head>
<body>

  <!-- ドロワーメニュー -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  
  <aside id="side-drawer" class="side-drawer">
    <div>
      <div class="drawer-header">
        <span class="drawer-title">SETTINGS</span>
        <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-menu-list">
        <button class="drawer-item" onclick="toggleModal('account-modal', true); closeDrawer();">👤 アカウント・プロフ設定</button>
        <a href="customize.html" class="drawer-item">🎨 デザイン着せ替え</a>
        <button class="drawer-item" onclick="alert('通知設定'); closeDrawer();">🔔 通知設定</button>
        <button class="drawer-item" onclick="alert('プライバシー設定'); closeDrawer();">🔒 プライバシー・セキュリティ</button>
        <button class="drawer-item" onclick="alert('ヘルプ'); closeDrawer();">❓ ヘルプ＆サポート</button>
      </div>
    </div>
    <button class="drawer-item" style="color: #ff6b6b; border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.05);" onclick="alert('ログアウトしました'); closeDrawer();">🚪 ログアウト</button>
  </aside>

  <div class="app-viewport">
    
    <!-- マイパル ページ -->
    <div id="page-mypal" class="page active">

      <!-- 名刺カード -->
      <div class="palcard" id="main-palcard">
        <div class="palcard-brand">PALFILE</div>
        <div class="palcard-body">
          <div class="profile-info">
            <input type="text" id="in-title" class="title-input" value="FOUNDER" readonly>
            <input type="text" id="in-name" class="pet-name" value="MEL">
            <div class="profile-fields">
              <div class="field-row"><span class="field-label">生年月日</span><input type="text" id="in-birth" class="field-input" value="2026.02.10"></div>
              <div class="field-row"><span class="field-label">好物</span><input type="text" id="in-food" class="field-input" value="ささみ / まぐろ"></div>
              <div class="field-row"><span class="field-label">特技</span><input type="text" id="in-skill" class="field-input" value="どこでも寝れる"></div>
              <div class="field-row"><span class="field-label">ニックネーム</span><input type="text" id="in-nickname" class="field-input" value="メルちゃん"></div>
            </div>
          </div>
          <div class="right-avatar-container">
            <label class="avatar-wrapper" id="main-avatar-wrapper">
              <div class="avatar-inner"><img id="avatar-img" src="https://picsum.photos/id/1025/300/300"></div>
              <input type="file" accept="image/*" onchange="previewImg(this, 'avatar-img')">
            </label>
          </div>
        </div>
        <div class="palcard-footer">
          <div class="footer-left-group">
            <button class="icon-btn" onclick="presentCard()"><span>名刺を渡す</span></button>
            <label class="icon-btn" style="cursor:pointer;">
              <span>名刺を受け取る</span>
              <input type="file" accept="image/*" capture="environment" onchange="alert('名刺を受け取りました！')">
            </label>
          </div>
          <div class="sns-links-container">
            <a id="btn-sns-instagram" href="#" target="_blank" class="sns-btn" title="Instagram">📸</a>
            <a id="btn-sns-x" href="#" target="_blank" class="sns-btn" title="X (Twitter)">𝕏</a>
          </div>
        </div>
      </div>

      <!-- 9マス Grid (ボタンを削除しスッキリ整理) -->
      <div class="grid-container">
        <script>
          const gridLabels = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'QR'];
          gridLabels.forEach((lbl, i) => {
            const labelHtml = (i === 2)
              ? `<input type="text" id="custom-free-label" class="grid-label-input" value="FREE" placeholder="タイトル" maxlength="12">`
              : lbl;

            document.write(`
              <div class="grid-item">
                <div class="grid-label">${labelHtml}</div>
                <label class="grid-image-box">
                  <img id="g${i}">
                  <input type="file" accept="image/*" onchange="previewGrid(this, 'g${i}')">
                </label>
              </div>`);
          });
        </script>
      </div>

      <div class="nav-spacer"></div>

    </div>

    <!-- みんなのパル ページ -->
    <div id="page-feed" class="page">
      <h2 style="font-family:'Cinzel'; color:var(--gold); font-size:1.1rem; text-align:center;">EVERYONE'S PAL</h2>
      
      <button class="action-btn-main" onclick="postToPublicFeed()">投稿する</button>

      <div id="feed-container" style="display:flex; flex-direction:column; gap:16px;"></div>
      <div id="scroll-marker" class="loading-tag">パルを読み込み中...</div>
      
      <div class="nav-spacer"></div>
    </div>

  </div>

  <!-- モーダル類 -->

  <!-- アルバム モーダル (現在のマス自動反映＆保存ボタン＋過去ログ) -->
  <div id="history-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px; color:var(--gold);">ALBUM</h3>
      
      <!-- 現在の9マス自動反映エリア -->
      <div class="album-current-section">
        <div class="album-section-title">
          <span>📸 現在のマイパル 9マス</span>
          <span style="font-size:0.6rem; color:var(--text-sub); font-weight:normal;">自動更新中</span>
        </div>
        <div class="mini-grid-container" id="current-grid-preview"></div>
        <button class="action-btn-main" style="margin-top:10px;" onclick="saveCurrentGridOnly()">現在の9マスを保存</button>
      </div>

      <div class="album-section-title" style="margin-bottom:10px;">
        <span>📅 保存された過去の9マス</span>
      </div>

      <div id="album-list">
        <p style="font-size:0.75rem; color:var(--text-sub);">保存された過去の9マスはありません。</p>
      </div>
      
      <button style="margin-top:16px; background:none; border:none; color:var(--gold); cursor:pointer; width:100%; text-align:center;" onclick="toggleModal('history-modal', false)">閉じる</button>
    </div>
  </div>

  <!-- アカウント・プロフ設定モーダル -->
  <div id="account-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px; color:var(--gold);">ACCOUNT & PROFILE</h3>
      <div style="margin-top:14px;">
        <div class="form-group">
          <label class="form-label">Instagram ID (例: username)</label>
          <input type="text" id="acc-instagram" class="form-input" placeholder="ユーザー名を入力">
        </div>
        <div class="form-group">
          <label class="form-label">X (Twitter) ID (例: username)</label>
          <input type="text" id="acc-x" class="form-input" placeholder="ユーザー名を入力">
        </div>
      </div>
      <button style="margin-top:16px; width:100%; padding:10px; background:var(--gold); border:none; border-radius:10px; color:#000; font-weight:bold; cursor:pointer;" onclick="saveAccountSettings()">保存する</button>
    </div>
  </div>

  <div id="user-profile-modal" class="user-profile-modal">
    <div class="profile-modal-container">
      <button class="close-modal-btn" onclick="closeUserProfile()">✕</button>
      <div class="palcard">
        <div class="palcard-brand">PALFILE</div>
        <div class="palcard-body">
          <div class="profile-info">
            <div id="target-title" class="title-input"></div>
            <div id="target-name" class="pet-name"></div>
            <div class="profile-fields">
              <div class="field-row"><span class="field-label">生年月日</span><div id="target-birth" class="field-input">2024.05.12</div></div>
              <div class="field-row"><span class="field-label">好物</span><div id="target-food" class="field-input">チュール / チキン</div></div>
              <div class="field-row"><span class="field-label">特技</span><div id="target-skill" class="field-input">ハイタッチ</div></div>
              <div class="field-row"><span class="field-label">ニックネーム</span><div id="target-nickname" class="field-input">ココちゃん</div></div>
            </div>
          </div>
          <div class="right-avatar-container">
            <div class="avatar-wrapper">
              <div class="avatar-inner"><img id="target-avatar" src=""></div>
            </div>
          </div>
        </div>
        <div class="palcard-footer">
          <button class="icon-btn" onclick="alert('名刺を交換しました！')"><span>名刺交換</span></button>
        </div>
      </div>
      <div class="grid-container" id="target-grid-container"></div>
      <div class="nav-spacer"></div>
    </div>
  </div>

  <div id="card-present-modal" class="card-present-overlay" onclick="closePresentCard()">
    <div class="card-present-wrapper" id="present-card-container"></div>
    <div class="card-present-tip">タップして閉じる</div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="btn-mypal" onclick="switchTab('mypal')">🏠 マイパル</button>
    <button class="nav-btn" onclick="openAlbumModal()">📖 アルバム</button>
    <button class="nav-btn" onclick="toggleModal('exchanged-modal', true)">🎴 名刺/9マス</button>
    <button class="nav-btn" id="btn-feed" onclick="switchTab('feed')">🐾 みんなのパル</button>
  </nav>

  <div id="exchanged-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-family:'Cinzel'; border-bottom:1px solid #333; padding-bottom:6px;">EXCHANGED CARDS</h3>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-top:12px;">交換した名刺や9マスがここに溜まります。</p>
      <button style="margin-top:16px; background:none; border:none; color:var(--gold); cursor:pointer;" onclick="toggleModal('exchanged-modal', false)">閉じる</button>
    </div>
  </div>

  <script>
    let palCount = 1;
    const names = ['COCO', 'LUNA', 'ROKI', 'TORA', 'LEO', 'MUKU', 'CHIP', 'BELL'];
    const titles = ['★ おやつハンター', '★ 爆走隊長', '★ 日向ぼっこプロ', '★ いたずら妖精'];
    const myHistoryAlbum = [];
    const postDataStore = {};

    /* カスタマイズ設定の自動反映 */
    function applySavedCustomization() {
      const saved = localStorage.getItem('parmel_custom_config');
      if (!saved) return;

      try {
        const config = JSON.parse(saved);
        const card = document.getElementById('main-palcard');
        const avatarWrapper = document.getElementById('main-avatar-wrapper');
        const petName = document.getElementById('in-name');

        if (card && config.theme) {
          card.className = card.className.replace(/theme-\w+/g, '');
          card.classList.add(config.theme);
        }

        if (avatarWrapper && config.frame) {
          avatarWrapper.className = avatarWrapper.className.replace(/frame-\w+/g, '');
          avatarWrapper.classList.add(config.frame);
        }

        if (petName && config.font) {
          petName.style.fontFamily = `'${config.font}', serif, sans-serif`;
        }
      } catch (e) {
        console.error('カスタマイズ設定の読み込みに失敗しました:', e);
      }
    }

    window.addEventListener('DOMContentLoaded', applySavedCustomization);

    /* スワイプ処理 */
    const drawer = document.getElementById('side-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const DRAWER_WIDTH = 280;

    let startX = 0;
    let startY = 0;
    let isTracking = false;
    let isOpen = false;

    function openDrawer() {
      isOpen = true;
      drawer.classList.add('animated');
      drawer.style.transform = `translateX(0px)`;
      drawerOverlay.classList.add('active');
    }

    function closeDrawer() {
      isOpen = false;
      drawer.classList.add('animated');
      drawer.style.transform = `translateX(-100%)`;
      drawerOverlay.classList.remove('active');
    }

    window.addEventListener('touchstart', (e) => {
      if (['INPUT', 'BUTTON', 'LABEL', 'TEXTAREA'].includes(e.target.tagName)) return;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isTracking = true;

      drawer.classList.remove('animated');
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isTracking) return;

      const touchX = e.touches[0].clientX;
      const touchY = e.touches[0].clientY;
      const diffX = touchX - startX;
      const diffY = Math.abs(touchY - startY);

      if (diffY > Math.abs(diffX) && diffY > 10) {
        isTracking = false;
        return;
      }

      if (!isOpen) {
        if (diffX > 0) {
          let translateX = -DRAWER_WIDTH + diffX;
          if (translateX > 0) translateX = 0;
          drawer.style.transform = `translateX(${translateX}px)`;
          drawerOverlay.style.opacity = Math.min(diffX / DRAWER_WIDTH, 1);
          drawerOverlay.style.pointerEvents = 'auto';
        }
      } else {
        if (diffX < 0) {
          let translateX = diffX;
          if (translateX < -DRAWER_WIDTH) translateX = -DRAWER_WIDTH;
          drawer.style.transform = `translateX(${translateX}px)`;
          drawerOverlay.style.opacity = Math.max(1 + (diffX / DRAWER_WIDTH), 0);
        }
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!isTracking) return;
      isTracking = false;

      const endX = e.changedTouches[0].clientX;
      const diffX = endX - startX;

      drawerOverlay.style.opacity = '';
      drawerOverlay.style.pointerEvents = '';

      if (!isOpen) {
        if (diffX > 50) {
          openDrawer();
        } else {
          closeDrawer();
        }
      } else {
        if (diffX < -50) {
          closeDrawer();
        } else {
          openDrawer();
        }
      }
    }, { passive: true });

    function saveAccountSettings() {
      const instaId = document.getElementById('acc-instagram').value.trim();
      const xId = document.getElementById('acc-x').value.trim();

      const btnInsta = document.getElementById('btn-sns-instagram');
      const btnX = document.getElementById('btn-sns-x');

      if (instaId) {
        const cleanInsta = instaId.replace(/^@/, '');
        btnInsta.href = `https://instagram.com/${cleanInsta}`;
        btnInsta.classList.add('active');
      } else {
        btnInsta.classList.remove('active');
      }

      if (xId) {
        const cleanX = xId.replace(/^@/, '');
        btnX.href = `https://x.com/${cleanX}`;
        btnX.classList.add('active');
      } else {
        btnX.classList.remove('active');
      }

      toggleModal('account-modal', false);
      alert('アカウント情報を更新しました！');
    }

    function generatePalPost() {
      const feed = document.getElementById('feed-container');
      const postId = 'post_' + palCount + '_' + Date.now();
      const rName = names[Math.floor(Math.random() * names.length)];
      const rTitle = titles[Math.floor(Math.random() * titles.length)];
      const avatarUrl = `https://picsum.photos/100?random=avatar_${palCount}_${Math.random()}`;
      
      const isNineGrid = Math.random() > 0.5;

      const userGridImgs = [];
      for (let i = 0; i < 9; i++) {
        userGridImgs.push(`https://picsum.photos/300?random=grid_${palCount}_${i}`);
      }

      postDataStore[postId] = {
        name: rName,
        title: rTitle,
        avatar: avatarUrl,
        gridImgs: userGridImgs,
        customFreeTitle: 'FREE'
      };

      const card = document.createElement('div');
      card.className = 'feed-post-card';
      card.setAttribute('onclick', `openUserProfile('${postId}')`);

      let mediaHtml = '';
      if (isNineGrid) {
        mediaHtml = `<div class="mini-grid-container">`;
        for (let i = 0; i < 9; i++) {
          mediaHtml += `<div class="mini-grid-item"><img src="${userGridImgs[i]}"></div>`;
        }
        mediaHtml += `</div>`;
      } else {
        const singleImg = `https://picsum.photos/400?random=single_${palCount}`;
        mediaHtml = `<div class="single-media-box"><img src="${singleImg}"></div>`;
      }

      card.innerHTML = `
        <div class="feed-header">
          <div class="feed-avatar"><img src="${avatarUrl}"></div>
          <div class="feed-user-info">
            <div class="feed-pet-name">${rName}</div>
            <div class="feed-title">${rTitle}</div>
          </div>
        </div>
        ${mediaHtml}
      `;

      feed.appendChild(card);
      palCount++;
    }

    function openUserProfile(postId) {
      const data = postDataStore[postId];
      if(!data) return;

      document.getElementById('target-name').innerText = data.name;
      document.getElementById('target-title').innerText = data.title;
      document.getElementById('target-avatar').src = data.avatar;

      const gridContainer = document.getElementById('target-grid-container');
      gridContainer.innerHTML = '';
      gridLabels.forEach((lbl, i) => {
        const imgSrc = data.gridImgs[i] || 'https://picsum.photos/300';
        const displayLabel = (i === 2 && data.customFreeTitle) ? data.customFreeTitle : lbl;

        gridContainer.innerHTML += `
          <div class="grid-item">
            <div class="grid-label">${displayLabel}</div>
            <div class="grid-image-box">
              <img src="${imgSrc}" style="display:block;">
            </div>
          </div>
        `;
      });

      const modal = document.getElementById('user-profile-modal');
      modal.classList.add('active');
    }

    function closeUserProfile() {
      document.getElementById('user-profile-modal').classList.remove('active');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if(tabName === 'mypal') {
        document.getElementById('page-mypal').classList.add('active');
        document.getElementById('btn-mypal').classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
      } else if(tabName === 'feed') {
        document.getElementById('page-feed').classList.add('active');
        document.getElementById('btn-feed').classList.add('active');
        
        const feed = document.getElementById('feed-container');
        if (feed.children.length === 0) {
          generatePalPost();
          generatePalPost();
        }
      }
    }

    function toggleModal(id, show) {
      const el = document.getElementById(id);
      if (show) { el.style.display = 'flex'; setTimeout(() => el.classList.add('active'), 10); }
      else { el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 200); }
    }

    function previewImg(input, targetId) {
      if (input.files && input.files[0]) {
        const r = new FileReader();
        r.onload = e => document.getElementById(targetId).src = e.target.result;
        r.readAsDataURL(input.files[0]);
      }
    }

    function previewGrid(input, imgId) {
      if (input.files && input.files[0]) {
        const r = new FileReader();
        r.onload = e => {
          const img = document.getElementById(imgId);
          img.src = e.target.result;
          img.style.display = 'block';
        };
        r.readAsDataURL(input.files[0]);
      }
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && document.getElementById('page-feed').classList.contains('active')) {
        generatePalPost();
      }
    }, { rootMargin: '200px' });

    observer.observe(document.getElementById('scroll-marker'));

    function getMyGridImages() {
      const imgs = [];
      for (let i = 0; i < 9; i++) {
        const imgEl = document.getElementById(`g${i}`);
        imgs.push((imgEl && imgEl.src) ? imgEl.src : '');
      }
      return imgs;
    }

    /* アルバムモーダルを開く＆現在のマスをプレビュー生成 */
    function openAlbumModal() {
      const currentImgs = getMyGridImages();
      const previewContainer = document.getElementById('current-grid-preview');
      previewContainer.innerHTML = '';

      for (let i = 0; i < 9; i++) {
        const src = currentImgs[i];
        const imgHtml = src ? `<img src="${src}">` : `<div style="width:100%; height:100%; background:#202428;"></div>`;
        previewContainer.innerHTML += `<div class="mini-grid-item">${imgHtml}</div>`;
      }

      toggleModal('history-modal', true);
    }

    function postToPublicFeed() {
      const name = document.getElementById('in-name').value;
      const title = document.getElementById('in-title').value;
      const avatarSrc = document.getElementById('avatar-img').src;
      const postId = 'post_my_' + Date.now();
      const myGridImgs = getMyGridImages();

      const freeLabelInput = document.getElementById('custom-free-label');
      const customFreeTitle = freeLabelInput ? (freeLabelInput.value.trim() || 'FREE') : 'FREE';

      saveToAlbum(myGridImgs, '投稿');

      postDataStore[postId] = {
        name: name,
        title: title,
        avatar: avatarSrc,
        gridImgs: myGridImgs,
        customFreeTitle: customFreeTitle
      };

      const feed = document.getElementById('feed-container');
      const card = document.createElement('div');
      card.className = 'feed-post-card';
      card.style.borderColor = 'var(--gold)';
      card.setAttribute('onclick', `openUserProfile('${postId}')`);
      
      let mediaHtml = `<div class="mini-grid-container">`;
      for (let i = 0; i < 9; i++) {
        const src = myGridImgs[i] || 'https://picsum.photos/300?random=empty';
        mediaHtml += `<div class="mini-grid-item"><img src="${src}"></div>`;
      }
      mediaHtml += `</div>`;

      card.innerHTML = `
        <div class="feed-header">
          <div class="feed-avatar"><img src="${avatarSrc}"></div>
          <div class="feed-user-info">
            <div class="feed-pet-name">${name}</div>
            <div class="feed-title">${title}</div>
          </div>
        </div>
        ${mediaHtml}
      `;
      feed.prepend(card);
      switchTab('feed');
      alert('「みんなのパル」に投稿しました！');
    }

    /* アルバム内で「現在の9マスを保存」を押したときの処理 */
    function saveCurrentGridOnly() {
      const myGridImgs = getMyGridImages();
      saveToAlbum(myGridImgs, '保存');
      alert('現在の9マスをアルバムに保存しました！');
    }

    function saveToAlbum(imgs, typeStr) {
      const albumList = document.getElementById('album-list');
      if(myHistoryAlbum.length === 0) albumList.innerHTML = '';

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      myHistoryAlbum.push({ date: dateStr, imgs: imgs });

      const itemHtml = document.createElement('div');
      itemHtml.className = 'album-history-item';
      
      let gridInner = `<div class="album-date">📅 ${dateStr} (${typeStr})</div><div class="mini-grid-container">`;
      for (let i = 0; i < 9; i++) {
        const src = imgs[i] || 'https://picsum.photos/300?random=empty';
        gridInner += `<div class="mini-grid-item"><img src="${src}"></div>`;
      }
      gridInner += `</div>`;
      itemHtml.innerHTML = gridInner;

      albumList.prepend(itemHtml);
    }

    function presentCard() {
      const cardSrc = document.getElementById('main-palcard');
      const clone = cardSrc.cloneNode(true);
      clone.removeAttribute('id');
      
      const origInputs = cardSrc.querySelectorAll('input');
      const cloneInputs = clone.querySelectorAll('input');
      origInputs.forEach((inp, idx) => {
        cloneInputs[idx].value = inp.value;
      });

      const footer = clone.querySelector('.palcard-footer');
      if (footer) footer.style.display = 'none';

      const container = document.getElementById('present-card-container');
      container.innerHTML = '';
      container.appendChild(clone);

      const modal = document.getElementById('card-present-modal');
      modal.classList.add('active');
    }

    function closePresentCard() {
      const modal = document.getElementById('card-present-modal');
      modal.classList.remove('active');
    }
  </script>
</body>
</html>
